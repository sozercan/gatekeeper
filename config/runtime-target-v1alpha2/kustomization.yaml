apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../runtime-target

patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: controller-manager
  path: runtime_v1alpha2_args_patch.yaml
- target:
    group: apps
    version: v1
    kind: Deployment
    name: audit
  path: runtime_v1alpha2_args_patch.yaml
