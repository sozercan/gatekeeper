apiVersion: connection.gatekeeper.sh/v1alpha1
kind: Connection
metadata:
  name: runtime-connection
  namespace: gatekeeper-system
  # Managed distributions whose older Connection CRD prunes spec.sources may
  # use this fail-closed fallback annotation instead of the sources field.
  # annotations:
  #   runtime.gatekeeper.sh/connection-source: runtime
spec:
  driver: disk
  sources:
  - runtime
  config:
    # Mount this parent path into the Gatekeeper controller-manager when using
    # the disk driver. Dapr or another registered driver can be used instead.
    path: /tmp/violations/topics
    maxAuditResults: 3
