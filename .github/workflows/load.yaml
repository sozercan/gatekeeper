  load_test:
    name: "Load test"
    runs-on: ubuntu-latest
    # needs: trigger
    timeout-minutes: 30
    steps:

      - name: Check out code into the Go module directory
        uses: actions/checkout@v2

      - name: Checkout clusterloader2
        run: |
          git clone https://github.com/kubernetes/perf-tests.git

      - name: Bootstrap e2e
        run: |
          mkdir -p $GITHUB_WORKSPACE/bin
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
          make e2e-bootstrap

      - name: Deploy Gatekeeper
        run: |
          make e2e-build-load-image IMG=gatekeeper-e2e:latest
          make deploy IMG=gatekeeper-e2e:latest USE_LOCAL_IMG=true

      - name: Deploy policies
        run: |
          ./test/load/deploy-policies.sh
        env:
          NUMBER_TEMPLATES: 5
          NUMBER_CONSTRAINTS: 5

      - name: Run load tests
        run: |
          ./run-e2e.sh cluster-loader2 \
            --nodes=1 \
            --provider=local \
            --report-dir="$GITHUB_WORKSPACE/_artifacts" \
            --testconfig="$GITHUB_WORKSPACE/test/load/config.yaml"
        working-directory: perf-tests
        env:
          CL2_POD_COUNT: 10
          CL2_POD_THROUGHPUT: 5
          CL2_WAIT_TIME: 1m

      - name: Fix invalid characters
        run: |
          set -x
          ls -al $GITHUB_WORKSPACE/_artifacts
          cd $GITHUB_WORKSPACE/_artifacts
          for f in *:*; do mv -v "$f" $(echo "$f" | tr ':' '-'); done

      - name: Upload artifacts
        uses: actions/upload-artifact@v2
        if: ${{ always() }}
        with:
          name: load_test_results
          path: |
            _artifacts/*.json

      - name: output
        run: |
          cat $GITHUB_WORKSPACE/_artifacts/*.json | jq -r '["NAME","CPU","MEMORY"], ["----","---","------"], (."100"[] | select((.Name | startswith("gatekeeper")) or (.Name | startswith("kube-apiserver"))) | [.Name, .CPU, .Mem]) | @tsv' | column -t > results.txt
          cat results.txt

