name: gatekeeper-pod
automanagedNamespaces: $POD_COUNT
tuningSets:
  - name: UniformQPS
    qpsLoad:
      qps: $QPS
steps:
  - name: Starting measurements
    measurements:
      - Identifier: ResourceUsageSummary
        Method: ResourceUsageSummary
        Params:
          action: start
          namespace: ""
  - measurements:
      - Identifier: WaitForRunningLatencyRCs
        Method: WaitForControlledPodsRunning
        Params:
          action: start
          apiVersion: v1
          kind: ReplicationController
          labelSelector: group = latency
          operationTimeout: 15m
  - phases:
      - namespaceRange:
          min: 1
          max: $POD_COUNT
        replicasPerNamespace: 1
        tuningSet: UniformQPS
        objectBundle:
          - basename: latency-pod-rc
            objectTemplatePath: rc.yaml
            templateFillMap:
              Replicas: 1
              Group: latency
  - measurements:
      - Identifier: WaitForRunningLatencyRCs
        Method: WaitForControlledPodsRunning
        Params:
          action: gather
  - name: Wait
    measurements:
      - Identifier: Wait
        Method: Sleep
        Params:
          duration: $WAIT_TIME
  - measurements:
      - Identifier: ResourceUsageSummary
        Method: ResourceUsageSummary
        Params:
          action: gather
